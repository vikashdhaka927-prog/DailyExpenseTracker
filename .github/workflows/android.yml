name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Diagnose AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          print("Manifest exists:", p.exists())
          print("Manifest path:", p.resolve())

          if not p.exists():
              raise SystemExit("ERROR: AndroidManifest.xml file not found")

          print("Manifest content:")
          print(p.read_text(encoding="utf-8"))

          try:
              ET.parse(p)
              print("SUCCESS: XML syntax is valid")
          except ET.ParseError as e:
              print("XML PARSE ERROR:", e)
              raise
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyExpenseTracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
